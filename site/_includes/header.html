{% assign theme_data = site.data.themes[page.theme] %}
<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{{ '/index.html' | relative_url }}">{{ theme_data.label }}</a>
    <nav class="tabs" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign item_path = '/' | append: item.file %}
        <a href="{{ item_path | relative_url }}"{% if item.id == page.page_key %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
